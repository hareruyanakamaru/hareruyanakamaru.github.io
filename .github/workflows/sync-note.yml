name: Sync note → microCMS

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Run sync
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_DOMAIN: hareruya-portfolio
          NOTE_USERNAME: itoawase
        run: python scripts/sync_note_to_microcms.py
