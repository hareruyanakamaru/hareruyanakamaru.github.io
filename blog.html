<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* 年ナビゲーション */

  border-radius:999px;
  color:var(--ink2);
  transition:all .2s;
}
.year-nav a:hover{
  border-color:var(--navy);
  color:var(--navy);
}
.year-nav a.active{
  background:var(--navy);
  color:var(--paper);
  border-color:var(--navy);
}

.year-section{margin-bottom:3.5rem;scroll-margin-top:140px;}

  color:var(--ink);
  font-family:'DM Mono',monospace;
}

    <div class="loading">読み込み中…</div>
  </div>
</main>

<script src="assets/chrome.js"></script>

<script>
const MICROCMS_DOMAIN = 'hareruya-portfolio';
const MICROCMS_API_KEY = 'oglpByvCLfiiCRxPnNqAEYUDMIy2MZnrgui6';

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCategory = (p, cat) => {
  const c = p.category;
  if(Array.isArray(c)) return c.includes(cat);
  return c === cat;
};
const tagsOf = p => Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);
const firstImageOf = s => {
  const str = String(s ?? '');
  const marker = str.match(/\[\[img:([^\]\s]+)\]\]/);
  if(marker) return marker[1];
  const tag = str.match(/<img[^>]+src=["']([^"']+)["']/i);
  return tag ? tag[1] : '';
};
const coverUrlOf = p => p.cover?.url || p.thumbnailUrl || firstImageOf(p.content);
const coverWithSize = (p, params) => {
  const u = coverUrlOf(p);
  if(!u) return '';
  return p.cover?.url ? `${u}?${params}` : u;
};

async function fetchAllBlogs(){
  let all = [];
  let offset = 0;
  const limit = 100;
  while(true){
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts?limit=${limit}&offset=${offset}&orders=-publishedAt`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    all = all.concat((data.contents || []).filter(p => hasCategory(p, 'Blog')));
    offset += limit;
    if(offset >= (data.totalCount || 0)) break;
  }
  return all;
}

function renderItem(p){
  const d = new Date(p.publishedAt);
  const ymd = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  const tags = tagsOf(p);
  const tagsLine = tags.length ? tags.map(t => `#${t}`).join(' ') : '';
  const thumbSrc = coverWithSize(p, 'w=400&h=300&fit=crop');
  const thumb = thumbSrc ? `<img src="${thumbSrc}" alt="" loading="lazy">` : '';
  return `<a class="blog-item" href="post.html?id=${encodeURIComponent(p.id)}">
    <div class="blog-thumb">${thumb}</div>
    <div class="blog-text">
      <div class="blog-meta">
        <span>${escapeHtml(ymd)}</span>
        ${tagsLine ? `<span class="blog-tags">${escapeHtml(tagsLine)}</span>` : ''}
      </div>
      <span class="blog-title">${escapeHtml(p.title)}</span>
    </div>
  </a>`;
}

async function loadBlogs(){
  const sections = document.getElementById('blog-sections');
  const yearNav = document.getElementById('year-nav');
  try{
    const blogs = await fetchAllBlogs();
    if(!blogs.length){
      sections.innerHTML = '<div class="empty">記事がまだありません</div>';
      return;
    }
    // 年別グルーピング
    const byYear = {};
    for(const p of blogs){
      const y = new Date(p.publishedAt).getFullYear();
      (byYear[y] = byYear[y] || []).push(p);
    }
    const years = Object.keys(byYear).map(Number).sort((a,b) => b - a);

    // 年ナビ生成
    yearNav.innerHTML = years.map(y =>
      `<a href="#year-${y}" data-year="${y}">${y}</a>`
    ).join('');

    // 各年セクション生成
    sections.innerHTML = years.map(y => {
      const items = byYear[y].map(renderItem).join('');
      return `<section class="year-section" id="year-${y}">
        <div class="year-heading">
          <span class="year-heading-num">${y}</span>
          <span class="year-heading-count">${byYear[y].length} posts</span>
        </div>
        <div class="blog-list">${items}</div>
      </section>`;
    }).join('');

    // 年ナビのクリックでスムーススクロール
    yearNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById(a.getAttribute('href').slice(1))
          ?.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });

    // スクロール位置で active 年をハイライト
    const links = [...yearNav.querySelectorAll('a')];
    const sectionEls = years.map(y => document.getElementById(`year-${y}`));
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(e.isIntersecting){
          const id = e.target.id;
          links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === `#${id}`));
        }
      });
    }, {rootMargin: '-40% 0px -55% 0px'});
    sectionEls.forEach(el => el && obs.observe(el));
    // 初期は最新年をactive
    links[0]?.classList.add('active');
  }catch(e){
    console.error(e);
    sections.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}
loadBlogs();
</script>
