<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Serif JP',serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

.page-head{
  padding:8rem 3rem 3rem;
  border-bottom:1px solid var(--line);
}
.page-title{
  font-size:2.6rem;font-weight:700;
  letter-spacing:.04em;
}

main{padding:2rem 3rem 6rem;max-width:920px;margin:0 auto;}
.blog-list{display:flex;flex-direction:column;}
.blog-item{
  display:grid;grid-template-columns:140px 1fr;gap:2rem;
  align-items:flex-start;
  padding:2rem 0;
  border-bottom:1px solid var(--line);
  transition:padding-left .2s;
}
.blog-item:first-child{border-top:1px solid var(--line);}
.blog-item:hover{padding-left:.4rem;}
.blog-item:hover .blog-title{color:var(--orange);}
.blog-thumb{
  width:140px;height:105px;
  background:var(--paper2);overflow:hidden;
}
.blog-thumb img{width:100%;height:100%;object-fit:cover;}
.blog-text{display:flex;flex-direction:column;gap:.4rem;}
.blog-meta{
  display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;
  font-size:.78rem;color:var(--muted);

}

  background:var(--paper2);padding:3px 8px;
  font-size:.7rem;
}
.blog-title{
  font-size:1.1rem;font-weight:600;
  line-height:1.5;transition:color .2s;
}
.blog-tags{
  font-size:.75rem;color:var(--muted);
  font-family:'DM Mono',monospace;letter-spacing:.04em;
  margin-top:.3rem;
}
.loading,.empty{
  text-align:center;color:var(--muted);
  padding:4rem 0;font-family:'DM Mono',monospace;font-size:12px;
}

<body>

<div id="nav-mount"></div>

<header class="page-head">
  <h1 class="page-title">Blog</h1>
</header>

<main>
  <div class="blog-list" id="blog-list">
    <div class="loading">読み込み中…</div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="assets/chrome.js"></script>

<script>
const MICROCMS_DOMAIN = 'hareruya-portfolio';
const MICROCMS_API_KEY = 'oglpByvCLfiiCRxPnNqAEYUDMIy2MZnrgui6';

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCategory = (p, cat) => {
  const c = p.category;
  if(Array.isArray(c)) return c.includes(cat);
  return c === cat;
};
const tagsOf = p => Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);
const firstImageOf = s => {
  const str = String(s ?? '');
  const marker = str.match(/\[\[img:([^\]\s]+)\]\]/);
  if(marker) return marker[1];
  const tag = str.match(/<img[^>]+src=["']([^"']+)["']/i);
  return tag ? tag[1] : '';
};
const coverUrlOf = p => p.cover?.url || p.thumbnailUrl || firstImageOf(p.content);
const coverWithSize = (p, params) => {
  const u = coverUrlOf(p);
  if(!u) return '';
  return p.cover?.url ? `${u}?${params}` : u;
};

async function loadBlogs(){
  const list = document.getElementById('blog-list');
  try{
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts?limit=100&orders=-publishedAt`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    const blogs = (data.contents || []).filter(p => hasCategory(p, 'Blog'));
    if(!blogs.length){
      list.innerHTML = '<div class="empty">記事がまだありません</div>';
      return;
    }
    list.innerHTML = blogs.map(p => {
      const d = new Date(p.publishedAt);
      const ymd = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      const tags = tagsOf(p);
      const tagsLine = tags.length ? tags.map(t => `#${t}`).join(' ') : '';
      const thumbSrc = coverWithSize(p, 'w=400&h=300&fit=crop');
      const thumb = thumbSrc ? `<img src="${thumbSrc}" alt="" loading="lazy">` : '';
      return `<a class="blog-item" href="post.html?id=${encodeURIComponent(p.id)}">
        <div class="blog-thumb">${thumb}</div>
        <div class="blog-text">
          <div class="blog-meta">
            <span>${escapeHtml(ymd)}</span>
            <span class="blog-cat">Blog</span>
          </div>
          <span class="blog-title">${escapeHtml(p.title)}</span>
          ${tagsLine ? `<div class="blog-tags">${escapeHtml(tagsLine)}</div>` : ''}
        </div>
      </a>`;
    }).join('');
  }catch(e){
    console.error(e);
    list.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}
loadBlogs();
</script>
</body>
