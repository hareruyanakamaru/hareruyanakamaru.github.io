  padding:0;
  background:transparent;
  z-index:30;

  width:max-content;
  animation:none;

.year-nav a{
  font-size:.95rem;
  color:var(--muted);
  opacity:.45;
  letter-spacing:.04em;
  cursor:pointer;
  transition:opacity .35s ease, font-size .4s cubic-bezier(.22,1,.36,1), color .35s ease, margin .4s ease;

  color:var(--ink);
  opacity:1;
  margin:.6rem 0;
  letter-spacing:.04em;
}
.year-nav .yn-month,
.year-nav .yn-line{display:none;}
.year-nav a.active .yn-month{
  display:block;
  font-size:.95rem;
  font-weight:400;
  color:var(--muted);
  letter-spacing:.2em;
  margin-top:.5rem;

  margin:.5rem auto 0;
  opacity:.4;
}

<script>
async function fetchAllBlogs(){
  let all = [];
  let offset = 0;
  const limit = 100;
  while(true){
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts?limit=${limit}&offset=${offset}&orders=-publishedAt`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    all = all.concat((data.contents || []).filter(p => hasCategory(p, 'Blog')));
    offset += limit;
    if(offset >= (data.totalCount || 0)) break;
  }
  return all;
}

function renderItem(p){
  const d = new Date(p.publishedAt);
  const ymd = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  const tags = tagsOf(p);
  const tagsLine = tags.length ? tags.map(t => `#${t}`).join(' ') : '';
  const thumbSrc = coverWithSize(p, 'w=400&h=300&fit=crop');
  const thumb = thumbSrc ? `<img src="${thumbSrc}" alt="" loading="lazy">` : '';
  return `<a class="blog-item" data-year="${d.getFullYear()}" data-month="${String(d.getMonth()+1).padStart(2,'0')}" href="post.html?id=${encodeURIComponent(p.id)}">
    <div class="blog-thumb">${thumb}</div>
    <div class="blog-text">
      <div class="blog-meta">
        <span>${escapeHtml(ymd)}</span>
        ${tagsLine ? `<span class="blog-tags">${escapeHtml(tagsLine)}</span>` : ''}
      </div>
      <span class="blog-title">${escapeHtml(p.title)}</span>
    </div>
  </a>`;
}

function setupScrollMonth(){
  const yearNav = document.getElementById('year-nav');
  const items = [...document.querySelectorAll('.blog-item')];
  const yearLinks = [...yearNav.querySelectorAll('a')];
  if(!items.length) return;

  let currentY = '', currentM = '';
  const update = () => {
    const offsetTop = window.innerHeight * 0.4; // 画面の40%付近を「現在地」とする
    let nearest = null;
    let nearestDist = Infinity;
    for(const item of items){
      const rect = item.getBoundingClientRect();
      if(rect.bottom < 0) continue;
      const dist = Math.abs(rect.top - offsetTop);
      if(dist < nearestDist){
        nearestDist = dist;
        nearest = item;
      }
    }
    if(!nearest) return;
    const y = nearest.dataset.year;
    const m = nearest.dataset.month;
    if(y === currentY && m === currentM) return;
    currentY = y; currentM = m;

    // active 年の更新
    yearLinks.forEach(a => {
      const isActive = a.dataset.year === y;
      a.classList.toggle('active', isActive);
      if(isActive){
        const monthEl = a.querySelector('.yn-month');
        if(monthEl) monthEl.textContent = m;
      }
    });
  };

  let ticking = false;
  window.addEventListener('scroll', () => {
    if(!ticking){
      requestAnimationFrame(() => { update(); ticking = false; });
      ticking = true;
    }
  }, {passive: true});
  update();
}

async function loadBlogs(){
  const sections = document.getElementById('blog-sections');
  const yearNav = document.getElementById('year-nav');
  try{
    const blogs = await fetchAllBlogs();
    if(!blogs.length){
      sections.innerHTML = '<div class="empty">記事がまだありません</div>';
      return;
    }
    // 年別グルーピング
    const byYear = {};
    for(const p of blogs){
      const y = new Date(p.publishedAt).getFullYear();
      (byYear[y] = byYear[y] || []).push(p);
    }
    const years = Object.keys(byYear).map(Number).sort((a,b) => b - a);

    // 年ナビ生成（各年に月・線のスロット付き）
    yearNav.innerHTML = years.map(y =>
      `<a href="#year-${y}" data-year="${y}">${y}<span class="yn-month"></span><span class="yn-line"></span></a>`
    ).join('');

    // 各年セクション生成
    sections.innerHTML = years.map(y => {
      const items = byYear[y].map(renderItem).join('');
      return `<section class="year-section" id="year-${y}">
        <div class="year-heading">
          <span class="year-heading-num">${y}</span>
          <span class="year-heading-count">${byYear[y].length} posts</span>
        </div>
        <div class="blog-list">${items}</div>
      </section>`;
    }).join('');

    // 年ナビのクリックでスムーススクロール
    yearNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById(a.getAttribute('href').slice(1))
          ?.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });

    // スクロール連動で active 年と現在月を更新
    setupScrollMonth();
  }catch(e){
    console.error(e);
    sections.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}
loadBlogs();
</script>
