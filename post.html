<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事 — 中丸晴留哉</title>
<meta name="description" content="中丸晴留哉のポートフォリオ記事">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#1c1a16;
  --paper:#f4f1e8;
  --paper2:#ebe7d9;
  --paper3:#e0dbca;
  --orange:#c8651a;
  --green:#3d6b38;
  --muted:#7a7568;
  --line:rgba(28,26,22,.1);
  --line2:rgba(28,26,22,.18);
}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Serif JP',serif;
  line-height:1.8;
}
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;
  background:rgba(244,241,232,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-logo{
  font-family:'DM Mono',monospace;
  font-size:12px;letter-spacing:.1em;
  color:var(--ink);text-decoration:none;
}
.nav-logo span{color:var(--muted);font-size:10px;margin-left:6px;}
.back-link{
  font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:.1em;
  color:var(--muted);text-decoration:none;
  transition:color .2s;
}
.back-link:hover{color:var(--orange);}
main{
  max-width:760px;
  margin:0 auto;
  padding:7rem 2rem 6rem;
}
.post-meta{
  font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:.1em;
  color:var(--muted);
  margin-bottom:1rem;
  display:flex;gap:1rem;align-items:center;flex-wrap:wrap;
}
.post-cat{
  background:var(--paper2);
  padding:4px 10px;
  font-size:10px;
}
.post-title{
  font-size:2rem;font-weight:800;
  line-height:1.5;
  margin-bottom:2rem;
  letter-spacing:.02em;
}
.post-cover{
  width:100%;
  margin-bottom:2.5rem;
  border:1px solid var(--line);
}
.post-tags{
  display:flex;flex-wrap:wrap;gap:.5rem;
  margin-bottom:2.5rem;
}
.post-tag{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:var(--muted);
  background:var(--paper2);
  padding:4px 10px;
}
.post-content{
  font-size:1rem;
  line-height:1.9;
}
.post-content h1,.post-content h2,.post-content h3{
  margin:2.5rem 0 1rem;
  font-weight:700;
}
.post-content h2{font-size:1.4rem;border-left:4px solid var(--orange);padding-left:1rem;}
.post-content h3{font-size:1.15rem;}
.post-content p{margin-bottom:1.2rem;}
.post-content a{color:var(--orange);}
.post-content ul,.post-content ol{margin:1rem 0 1.2rem 1.5rem;}
.post-content blockquote{
  border-left:3px solid var(--paper3);
  padding-left:1.2rem;
  color:var(--muted);
  margin:1.5rem 0;
  font-style:italic;
}
.post-content img{max-width:100%;height:auto;display:block;}
.post-content figure{
  margin:2rem 0;
}
.post-content figure img{
  margin:0;
  border:1px solid var(--line);
}
.post-content figcaption{
  font-size:.85rem;
  color:var(--muted);
  margin-top:.6rem;
  line-height:1.5;
  text-align:left;
  padding-left:.2rem;
  border-left:2px solid var(--paper3);
  padding:.2rem 0 .2rem .8rem;
}
.post-content code{
  background:var(--paper2);
  padding:2px 6px;
  font-family:'DM Mono',monospace;
  font-size:.9em;
}
.post-content pre{
  background:var(--paper2);
  padding:1rem;
  overflow-x:auto;
  margin:1.5rem 0;
}
.post-footer{
  margin-top:4rem;
  padding-top:2rem;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.loading,.error{
  text-align:center;
  color:var(--muted);
  padding:4rem 0;
  font-family:'DM Mono',monospace;
  font-size:12px;
}
@media(max-width:600px){
  nav{padding:0 1.5rem;}
  main{padding:6rem 1.5rem 4rem;}
  .post-title{font-size:1.4rem;}
}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">中丸晴留哉 <span>/ HARUREYA</span></a>
  <a class="back-link" href="index.html">← back</a>
</nav>

<main id="post">
  <div class="loading">読み込み中…</div>
</main>

<script>
const MICROCMS_DOMAIN = 'hareruya-portfolio';
const MICROCMS_API_KEY = 'oglpByvCLfiiCRxPnNqAEYUDMIy2MZnrgui6';

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getPostId(){
  const params = new URLSearchParams(location.search);
  return params.get('id');
}

async function loadPost(){
  const id = getPostId();
  const main = document.getElementById('post');
  if(!id){
    main.innerHTML = '<div class="error">記事IDが指定されていません</div>';
    return;
  }
  try{
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts/${id}`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error: ' + res.status);
    const p = await res.json();

    document.title = `${p.title} — 中丸晴留哉`;

    const d = new Date(p.publishedAt);
    const ymd = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const cat = Array.isArray(p.category) ? p.category[0] : p.category;
    const tags = Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);

    main.innerHTML = `
      <div class="post-meta">
        <span>${escapeHtml(ymd)}</span>
        ${cat ? `<span class="post-cat">${escapeHtml(cat)}</span>` : ''}
      </div>
      <h1 class="post-title">${escapeHtml(p.title)}</h1>
      ${p.cover?.url ? `<img class="post-cover" src="${p.cover.url}" alt="${escapeHtml(p.title)}">` : ''}
      ${tags.length ? `<div class="post-tags">${tags.map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <article class="post-content">${p.content || ''}</article>
      <div class="post-footer">
        <a class="back-link" href="index.html">← 一覧に戻る</a>
      </div>
    `;
  }catch(e){
    console.error(e);
    main.innerHTML = '<div class="error">記事の読み込みに失敗しました</div>';
  }
}
loadPost();
</script>
</body>
</html>
