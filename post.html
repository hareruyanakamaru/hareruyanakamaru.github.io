.post-content a{color:var(--orange);text-decoration:underline;text-underline-offset:3px;}
.post-content ul,.post-content ol{margin:1rem 0 1.2rem 1.5rem;}

  border-left:3px solid var(--paper3);
  padding-left:1.2rem;
  color:var(--muted);
  margin:1.5rem 0;
  font-style:italic;
}
.post-content img{max-width:100%;height:auto;display:block;margin:1.6rem auto;}

}

  margin-top:4rem;
  padding-top:2rem;

<body>

<div id="nav-mount"></div>

<main id="post">
  <div class="loading">読み込み中…</div>
</main>

<div id="footer-mount"></div>

<script src="assets/chrome.js"></script>
<script src="assets/utils.js"></script>
<script>
// note からインポートした記事は本文中の <img> がmicroCMSにより除去されているため
// [[img:URL]] というマーカー形式で保存している。表示時に <img> タグへ復元する。
const renderContent = html => String(html ?? '').replace(
  /\[\[img:([^\]\s]+)\]\]/g,
  (_, url) => `<img src="${url}" alt="" loading="lazy" referrerpolicy="no-referrer">`
);

function linkifyTextNodes(root){
  const urlRegex = /(https?:\/\/[^\s<>'"]+)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest('a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const targets = [];
  let node;
  while(node = walker.nextNode()){
    urlRegex.lastIndex = 0;
    if(urlRegex.test(node.nodeValue)) targets.push(node);
  }
  targets.forEach(textNode => {
    const text = textNode.nodeValue;
    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    text.replace(urlRegex, (match, url, offset) => {
      if(offset > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, offset)));
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = url;
      frag.appendChild(a);
      lastIdx = offset + match.length;
    });
    if(lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
    textNode.parentNode.replaceChild(frag, textNode);
  });
}

function getPostId(){
  const params = new URLSearchParams(location.search);
  return params.get('id');
}

function setMeta(name, content, isProperty = false){
  const attr = isProperty ? 'property' : 'name';
  let el = document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){
    el = document.createElement('meta');
    el.setAttribute(attr, name);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content);
}

async function loadPost(){
  const id = getPostId();
  const main = document.getElementById('post');
  if(!id){
    main.innerHTML = '<div class="error">記事IDが指定されていません</div>';
    return;
  }
  try{
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts/${id}`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error: ' + res.status);
    const p = await res.json();

    const title = `${p.title} — 中丸晴留哉`;
    document.title = title;
    const desc = stripHtml(p.content).slice(0, 120);
    setMeta('description', desc);
    setMeta('og:title', title, true);
    setMeta('og:description', desc, true);
    const ogImg = p.cover?.url || p.thumbnailUrl || (p.content.match(/<img[^>]+src=["']([^"']+)["']/i)?.[1]);
    if(ogImg) setMeta('og:image', ogImg, true);

    // 構造化データ（Article + BreadcrumbList）
    const isBlog = (Array.isArray(p.category) ? p.category.includes('Blog') : p.category === 'Blog');
    const ldJson = {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": isBlog ? "BlogPosting" : "Article",
          "headline": p.title,
          "description": desc,
          "image": ogImg ? [ogImg] : undefined,
          "datePublished": p.publishedAt,
          "dateModified": p.updatedAt || p.publishedAt,
          "author": {"@type": "Person", "name": "中丸晴留哉", "url": "https://hareruyanakamaru.github.io/about.html"},
          "publisher": {"@type": "Person", "name": "中丸晴留哉"},
          "mainEntityOfPage": {"@type": "WebPage", "@id": `https://hareruyanakamaru.github.io/post.html?id=${encodeURIComponent(p.id)}`}
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://hareruyanakamaru.github.io/"},
            {"@type": "ListItem", "position": 2, "name": isBlog ? "Blog" : "Works", "item": isBlog ? "https://hareruyanakamaru.github.io/blog.html" : "https://hareruyanakamaru.github.io/works.html"},
            {"@type": "ListItem", "position": 3, "name": p.title}
          ]
        }
      ]
    };
    const ldScript = document.createElement('script');
    ldScript.type = 'application/ld+json';
    ldScript.textContent = JSON.stringify(ldJson);
    document.head.appendChild(ldScript);

    const d = new Date(p.publishedAt);
    const ymd = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const catArr = Array.isArray(p.category) ? p.category : (p.category ? [p.category] : []);
    const visibleCats = catArr.filter(c => c !== 'Hero');
    const cat = visibleCats[0] || catArr[0];
    const tags = Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);
    const backHref = cat === 'Blog' ? 'blog.html' : 'works.html';
    const backLabel = cat === 'Blog' ? '← Blog一覧へ' : '← Works一覧へ';

    main.innerHTML = `
      <div class="post-meta">
        <span>${escapeHtml(ymd)}</span>
        ${cat ? `<span class="post-cat">${escapeHtml(cat)}</span>` : ''}
      </div>
      <h1 class="post-title">${escapeHtml(p.title)}</h1>
      ${(p.cover?.url || p.thumbnailUrl) ? `<img class="post-cover" src="${p.cover?.url || p.thumbnailUrl}" alt="${escapeHtml(p.title)}">` : ''}
      ${tags.length ? `<div class="post-tags">${tags.map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <article class="post-content">${renderContent(p.content || '')}</article>
      <div class="post-footer">
        <a href="${backHref}">${backLabel}</a>
        <a href="index.html">Home →</a>
      </div>
    `;
    const contentEl = main.querySelector('.post-content');
    if(contentEl) linkifyTextNodes(contentEl);
  }catch(e){
    console.error(e);
    main.innerHTML = '<div class="error">記事の読み込みに失敗しました</div>';
  }
}
loadPost();
</script>
</body>
