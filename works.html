<script>
const MICROCMS_DOMAIN = 'hareruya-portfolio';
const MICROCMS_API_KEY = 'oglpByvCLfiiCRxPnNqAEYUDMIy2MZnrgui6';

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCategory = (p, cat) => {
  const c = p.category;
  if(Array.isArray(c)) return c.includes(cat);
  return c === cat;
};
const tagsOf = p => Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);

async function loadWorks(){
  const grid = document.getElementById('works-grid');
  try{
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts?limit=100&orders=-publishedAt`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    const works = (data.contents || []).filter(p => hasCategory(p, 'Works'));
    if(!works.length){
      grid.innerHTML = '<div class="empty">作品がまだありません</div>';
      return;
    }
    grid.innerHTML = works.map(p => {
      const d = new Date(p.publishedAt);
      const year = d.getFullYear();
      const tags = tagsOf(p);
      const tagsLine = tags.length ? tags.join(' / ') : '';
      const cover = p.cover?.url
        ? `<img src="${p.cover.url}?w=800&fit=crop" alt="${escapeHtml(p.title)}">`
        : '';
      return `<a class="work-card" href="post.html?id=${encodeURIComponent(p.id)}">
        <div class="work-cover">${cover}</div>
        <div class="work-title">${escapeHtml(p.title)}</div>
        ${tagsLine ? `<div class="work-tags">${escapeHtml(tagsLine)}</div>` : ''}
        <div class="work-year">${year}</div>
      </a>`;
    }).join('');
  }catch(e){
    console.error(e);
    grid.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}
loadWorks();
</script>
