<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Serif JP',serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

.page-head{
  padding:8rem 3rem 3rem;
  border-bottom:1px solid var(--line);
}

  font-size:2.6rem;font-weight:700;

.works-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:3rem 2rem;
  max-width:1200px;margin:0 auto;
}
.work-card{
  display:block;
  transition:transform .25s;
}
.work-card:hover{transform:translateY(-4px);}
.work-card:hover .work-title{color:var(--orange);}
.work-cover{
  width:100%;aspect-ratio:4/3;
  background:var(--paper2);overflow:hidden;
}
.work-cover img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .4s;
}
.work-card:hover .work-cover img{transform:scale(1.04);}
.work-title{
  font-size:1.05rem;font-weight:600;
  margin:1rem 0 .4rem;
  line-height:1.5;transition:color .2s;
}
.work-tags{
  font-size:.78rem;color:var(--muted);
  font-family:'DM Mono',monospace;
  letter-spacing:.04em;margin-bottom:.3rem;
}
.work-year{
  font-size:.75rem;color:var(--muted);
  font-family:'DM Mono',monospace;letter-spacing:.06em;
}
.loading,.empty{
  text-align:center;color:var(--muted);
  padding:4rem 0;font-family:'DM Mono',monospace;font-size:12px;
}

@media(max-width:900px){
  .page-head{padding:6rem 1.5rem 2rem;}
  .page-title{font-size:1.9rem;}
  main{padding:2rem 1.5rem 4rem;}
  .works-grid{grid-template-columns:1fr;gap:1.5rem;}
}

<body>

<div id="nav-mount"></div>

<header class="page-head">
  <h1 class="page-title">Works</h1>

  <div class="works-grid" id="works-grid">
    <div class="loading">読み込み中…</div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="assets/chrome.js"></script>

<script>
const MICROCMS_DOMAIN = 'hareruya-portfolio';
const MICROCMS_API_KEY = 'oglpByvCLfiiCRxPnNqAEYUDMIy2MZnrgui6';

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCategory = (p, cat) => {
  const c = p.category;
  if(Array.isArray(c)) return c.includes(cat);
  return c === cat;
};
const tagsOf = p => Array.isArray(p.tags) ? p.tags : (p.tags ? [p.tags] : []);

async function loadWorks(){
  const grid = document.getElementById('works-grid');
  try{
    const url = `https://${MICROCMS_DOMAIN}.microcms.io/api/v1/posts?limit=100&orders=-publishedAt`;
    const res = await fetch(url, { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    const works = (data.contents || []).filter(p => hasCategory(p, 'Works'));
    if(!works.length){
      grid.innerHTML = '<div class="empty">作品がまだありません</div>';
      return;
    }
    grid.innerHTML = works.map(p => {
      const tags = tagsOf(p);
      const tagsLine = tags.length ? tags.join(' / ') : '';
      const cover = p.cover?.url
        ? `<img src="${p.cover.url}?w=800&fit=crop" alt="${escapeHtml(p.title)}">`
        : '';
      return `<a class="work-card" href="post.html?id=${encodeURIComponent(p.id)}">
        <div class="work-cover">${cover}</div>
        <div class="work-title">${escapeHtml(p.title)}</div>
        ${tagsLine ? `<div class="work-tags">${escapeHtml(tagsLine)}</div>` : ''}
      </a>`;
    }).join('');
  }catch(e){
    console.error(e);
    grid.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}
loadWorks();
</script>
</body>
